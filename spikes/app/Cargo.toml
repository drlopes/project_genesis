[package]
name = "spike_app"
version = "0.0.0"
edition = "2024"
publish = false
description = "E3–E7: Bevy app streaming cube-sphere patches from the spike field."

[dependencies]
spike_field = { path = "../field" }
spike_voxel = { path = "../voxel" }
genesis_core = { path = "../../crates/genesis_core" }
bevy = "0.20"
# E6: the walking character. Same feature set as spikes/physics, so the build is shared.
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "xpbd_joints", "parallel"] }
