[package]
name = "spike_physics"
version = "0.0.0"
edition = "2024"
publish = false
description = "E6: headless collision and physics tests against the spike field (Avian, Rapier)."

[features]
# One engine per build keeps compile times and target/ size down.
default = ["avian"]
avian = ["dep:avian3d"]
rapier = ["dep:bevy_rapier3d"]

[dependencies]
spike_app = { path = "../app" }
spike_field = { path = "../field" }
genesis_core = { path = "../../crates/genesis_core" }
bevy = "0.20"
# Headless: no gizmos, render, scene, or picking.
avian3d = { version = "0.8", optional = true, default-features = false, features = ["3d", "parry-f32", "xpbd_joints", "parallel"] }
bevy_rapier3d = { version = "0.37", optional = true }
